<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cognistate</title>
    <style>
        /* ====== GENERELL STIL ====== */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #e2e8f0;
            font-family: "Inter", Arial, sans-serif;
            overflow: hidden;
            background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 80%);
            position: relative;
        }

        /* ====== ANIMERT BAKGRUNNSMØNSTER ====== */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: moveGrid 20s linear infinite;
            z-index: 0;
        }

        @keyframes moveGrid {
            from { background-position: 0 0; }
            to { background-position: 40px 40px; }
        }

        /* ====== INNHOLD ====== */
        h1 {
            font-size: 3.5rem;
            margin: 0;
            z-index: 1;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(94,234,212,0.4);
            color: #94f5ff;
        }

        p {
            font-size: 1.2rem;
            z-index: 1;
            opacity: 0.85;
        }

        /* ====== LYS GLOW ANIMASJON ====== */
        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(94,234,212,0.15) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            animation: pulse 6s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes pulse {
            0% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.2); }
        }

    </style>
</head>
<body>
    <div class="glow"></div>
    <h1>Cognistate</h1>
    <p>Utforsk forbindelsen mellom kognisjon, data og tilstand.</p>
</body>
</html>
