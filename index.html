<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CogniState</title>
  <meta name="description" content="CogniState kartlegger og forbedrer beslutningsevne ved hjelp av moderne teknologi, datadrevet innsikt og kognitiv analyse." />
  <link rel="icon" type="image/png" href="assets/cognistate-logo.png" />
  <style>
    /* ---------- Basestil ---------- */
    :root{
      --bg-deep:#0f172a;      /* mørk bakgrunn */
      --bg-slate:#1e293b;     /* sekundær mørk */
      --text:#e2e8f0;         /* lys tekst */
      --muted:#cbd5e1;        /* dempet tekst */
      --accent:#94f5ff;       /* cyan aksent */
      --accent-soft: rgba(148,245,255,.25);
      --grid-dot: rgba(255,255,255,.05);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background: radial-gradient(1200px 800px at 30% 20%, var(--bg-slate), var(--bg-deep) 70%);
      overflow-x:hidden;
      min-height:100vh;
    }

    /* Subtilt rutenett som beveger seg */
    body::before{
      content:"";
      position:fixed;
      inset:0;
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size:40px 40px;
      animation:moveGrid 20s linear infinite;
      pointer-events:none;
      z-index:0;
    }
    @keyframes moveGrid{
      from{ background-position:0 0 }
      to{   background-position:40px 40px }
    }

    /* Myk cyan-glow bak scenen */
    .glow{
      position:fixed;
      inset:auto;
      left:50%;
      top:50%;
      width:min(1200px,90vw);
      height:min(1200px,90vw);
      transform:translate(-50%,-50%);
      background:radial-gradient(circle, rgba(94,234,212,.18) 0%, transparent 65%);
      filter: blur(2px);
      animation:pulse 6s ease-in-out infinite alternate;
      z-index:0;
    }
    @keyframes pulse{
      0%{ opacity:.45; transform:translate(-50%,-50%) scale(1) }
      100%{ opacity:.75; transform:translate(-50%,-50%) scale(1.12) }
    }

    /* ---------- Header / logo ---------- */
    header.brand{
      position:fixed;
      top:24px; left:24px;
      display:flex; align-items:center; gap:12px;
      z-index:3;
    }
    header.brand img{
      height:44px; width:auto; display:block;
      filter: drop-shadow(0 0 8px var(--accent-soft));
    }
    header.brand span{
      font-weight:700; letter-spacing:.3px; font-size:1.2rem; color:#e8f3ff;
    }
    /* myk lokal glow bak logoen for “smooth” integrasjon */
    header.brand::before{
      content:"";
      position:absolute;
      width:84px; height:84px; left:-10px; top:-12px; z-index:-1;
      border-radius:50%;
      background:radial-gradient(circle, rgba(94,234,212,.16), transparent 70%);
      filter: blur(.5px);
    }

    /* ---------- Hovedinnhold ---------- */
    main{
      position:relative;
      z-index:1;
      min-height:100vh;
      display:flex; align-items:center; justify-content:center;
      padding:96px 24px 120px; /* plass for header/footer */
      text-align:center;
    }
    .hero{
      max-width:820px;
    }
    .title{
      font-size: clamp(2.2rem, 4.5vw, 3.6rem);
      margin:0 0 .6rem 0;
      letter-spacing:.5px;
      color:var(--accent);
      text-shadow:0 0 20px var(--accent-soft);
    }
    .tagline{
      font-size: clamp(1.05rem, 1.7vw, 1.25rem);
      line-height:1.65;
      margin:0 auto;
      color:var(--text);
      opacity:.95;
    }

    /* CTA-knapp (kan kobles senere) */
    .cta{
      margin-top:22px;
      display:inline-block;
      padding:10px 16px;
      border:1px solid rgba(148,245,255,.35);
      color:var(--accent);
      text-decoration:none;
      border-radius:10px;
      backdrop-filter:saturate(120%) blur(0px);
      transition: all .25s ease;
    }
    .cta:hover{
      transform:translateY(-1px);
      box-shadow:0 0 18px rgba(148,245,255,.18);
    }

    /* ---------- Footer ---------- */
    footer{
      position:fixed;
      bottom:22px; left:0; right:0;
      display:flex; justify-content:center; gap:14px;
      z-index:2;
      font-size:.95rem; color:var(--muted);
      padding:0 16px;
      text-align:center;
    }
    footer a{
      color:var(--accent);
      text-decoration:none;
      transition:opacity .25s ease;
    }
    footer a:hover{ opacity:.8 }

    /* Små skjermer */
    @media (max-width:420px){
      header.brand img{ height:38px }
      header.brand span{ display:none } /* bare ikon på veldig små skjermer */
      footer{ font-size:.9rem }
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <!-- Logo / brand -->
  <header class="brand">
    <img src="assets/cognistate-logo.png" alt="CogniState logo" />
    <span>CogniState</span>
  </header>

  <!-- Innhold -->
  <main>
    <section class="hero">
      <h1 class="title">CogniState</h1>
      <p class="tagline">
        CogniState arbeider med å <strong>kartlegge og forbedre beslutningsevne</strong>
        gjennom moderne teknologi, datadrevet innsikt og kognitiv analyse.
      </p>

      <!-- Valgfri call-to-action – koble når du vil -->
      <!-- <a class="cta" href="#kontakt">Kontakt oss</a> -->
    </section>
  </main>

  <!-- Kontakt -->
  <footer>
    <a href="https://instagram.com/cognistate" target="_blank" rel="noopener">Instagram: @cognistate</a>
    <span>•</span>
    <a href="mailto:contact@cognistate.io">contact@cognistate.io</a>
  </footer>
</body>
</html>
